name: Publish Lambda Layer

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  LAYER_NAME: typst-binary
  COMPATIBLE_RUNTIMES: nodejs24.x

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build layer
        run: |
          npm ci
          npm run build:layer${{ matrix.architecture == 'arm64' && ':arm64' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-layer-${{ matrix.architecture }}
          path: src/adapters/lambda-layer/typst-layer${{ matrix.architecture == 'arm64' && '-arm64' || '' }}.zip

  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        region:
          - us-east-1
          - us-east-2
          - us-west-1
          - us-west-2
          - ap-south-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-southeast-1
          - ap-southeast-2
          - eu-central-1
          - eu-west-1
          - eu-west-2
          - eu-north-1
        architecture: [x86_64, arm64]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: typst-layer-${{ matrix.architecture }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # OIDC: set AWS_ROLE_ARN in repo variables (Settings → Secrets and variables → Actions)
          # Static: set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repo secrets
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      - name: Publish layer
        run: |
          aws lambda publish-layer-version \
            --layer-name ${{ env.LAYER_NAME }} \
            --description "Typst binary for Lambda (${{ matrix.architecture }})" \
            --zip-file fileb://typst-layer${{ matrix.architecture == 'arm64' && '-arm64' || '' }}.zip \
            --compatible-runtimes ${{ env.COMPATIBLE_RUNTIMES }} \
            --compatible-architectures ${{ matrix.architecture }} \
            --region ${{ matrix.region }}
